<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="50%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff007a"/>
    </linearGradient>
    <linearGradient id="key_glow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="trail2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7000ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="trail3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff007a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff007a" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.7"/>

  <!-- Waterfall Synth Trails -->
  <rect x="124" y="90" width="32" height="240" rx="8" fill="url(#trail1)"/>
  <rect x="180" y="60" width="32" height="270" rx="8" fill="url(#trail2)"/>
  <rect x="236" y="130" width="32" height="200" rx="8" fill="url(#trail3)"/>
  <rect x="292" y="80" width="32" height="250" rx="8" fill="url(#trail1)"/>
  <rect x="348" y="110" width="32" height="220" rx="8" fill="url(#trail2)"/>

  <!-- Glowing Particles / Sparks -->
  <circle cx="140" cy="85" r="5" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="196" cy="55" r="6" fill="#9d4edd" filter="url(#glow)"/>
  <circle cx="252" cy="120" r="5" fill="#ff007a" filter="url(#glow)"/>
  <circle cx="308" cy="75" r="6" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="364" cy="105" r="5" fill="#9d4edd" filter="url(#glow)"/>

  <!-- Horizontal Glow Separator -->
  <rect x="64" y="328" width="384" height="4" fill="url(#accent)" filter="url(#glow)"/>

  <!-- Piano Keyboard Bed -->
  <rect x="64" y="332" width="384" height="116" rx="14" fill="#111622" stroke="#1f293d" stroke-width="2"/>

  <!-- White Keys -->
  <g fill="#eef2f7">
    <rect x="72" y="336" width="28" height="104" rx="4"/>
    <rect x="104" y="336" width="28" height="104" rx="4"/>
    <rect x="136" y="336" width="28" height="104" rx="4"/>
    <rect x="168" y="336" width="28" height="104" rx="4" fill="#00f0ff" opacity="0.9" filter="url(#glow)"/>
    <rect x="200" y="336" width="28" height="104" rx="4"/>
    <rect x="232" y="336" width="28" height="104" rx="4"/>
    <rect x="264" y="336" width="28" height="104" rx="4" fill="#ff007a" opacity="0.9" filter="url(#glow)"/>
    <rect x="296" y="336" width="28" height="104" rx="4"/>
    <rect x="328" y="336" width="28" height="104" rx="4"/>
    <rect x="360" y="336" width="28" height="104" rx="4" fill="#7000ff" opacity="0.9" filter="url(#glow)"/>
    <rect x="392" y="336" width="28" height="104" rx="4"/>
    <rect x="424" y="336" width="16" height="104" rx="3"/>
  </g>

  <!-- Black Keys -->
  <g fill="#0b0e14">
    <rect x="92" y="336" width="18" height="64" rx="3"/>
    <rect x="124" y="336" width="18" height="64" rx="3"/>
    <rect x="188" y="336" width="18" height="64" rx="3" fill="#7000ff" filter="url(#glow)"/>
    <rect x="220" y="336" width="18" height="64" rx="3"/>
    <rect x="252" y="336" width="18" height="64" rx="3"/>
    <rect x="316" y="336" width="18" height="64" rx="3" fill="#00f0ff" filter="url(#glow)"/>
    <rect x="348" y="336" width="18" height="64" rx="3"/>
    <rect x="380" y="336" width="18" height="64" rx="3"/>
    <rect x="412" y="336" width="18" height="64" rx="3"/>
  </g>
</svg>
