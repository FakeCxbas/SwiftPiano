name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Headless Unit & Synthesis Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Import project assets
        run: godot --headless --path . --editor --import --quit

      - name: Run automated test suite
        run: godot --headless --audio-driver Dummy --path . --script tests/test_piano.gd
